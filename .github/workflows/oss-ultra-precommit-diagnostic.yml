# Temporary, read-only diagnostic workflow on the user's public cpplint fork.
# Never runs on the protected upstream repository or the user's private repos.
name: OSS-ULTRA pre-commit diagnostics
on:
  push:
    branches:
      - diagnostic/precommit-pr485-20261114
permissions:
  contents: read
jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Diagnose hooks for the exact three PR #485 files
        run: pre-commit run --files CHANGELOG.rst cpplint.py cpplint_unittest.py --show-diff-on-failure --color never
