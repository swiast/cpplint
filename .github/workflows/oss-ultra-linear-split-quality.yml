# Temporary fork-only lint research; never deploys or writes upstream.
name: OSS-ULTRA linear split code quality
on:
  pull_request:
    branches:
      - develop
permissions:
  contents: read
jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Validate linear-split source and tests
        run: pre-commit run --files cpplint.py cpplint_unittest.py --show-diff-on-failure --color never
