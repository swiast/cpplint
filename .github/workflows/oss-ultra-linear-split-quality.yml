# Temporary fork-only lint research; never deploys or writes upstream.
name: OSS-ULTRA linear split code quality
on:
  pull_request:
    branches:
      - develop
permissions:
  contents: read
jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Validate linear-split source and tests
        run: pre-commit run --files cpplint.py cpplint_unittest.py --show-diff-on-failure --color never
      - name: Compile C++17 comparison controls (GCC and Clang)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/oss-ultra-nontype-compare.cpp <<'CPP'
          template <bool, class T> struct Foo {};
          constexpr int N = 1, M = 2;
          struct A { A(Foo<N < 2, int> value, int code); };
          struct B { B(Foo<N < M, int> value, int code); };
          struct C { C(Foo<'a' < 'b', int> value, int code); };
          struct D { D(Foo<true && N < 2, int> value, int code); };
          template <class> struct Upper {};
          struct Lower {};
          template <class, bool> struct TypeBool {};
          struct E { E(int code, TypeBool<Upper<Lower>, N<M> value); };
          CPP
          g++ -std=c++17 -fsyntax-only /tmp/oss-ultra-nontype-compare.cpp
          clang++ -std=c++17 -fsyntax-only /tmp/oss-ultra-nontype-compare.cpp
